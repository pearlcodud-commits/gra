<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>꺾은선그래프 탐정단</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
<style>
/* VOICE: 신나는 4학년 교실 게임, 교과서 '디지털 콕콕' 단계 그대로
   IDEA: 모눈 공책 위에서 푸는 탐정 미션 카드
   PICTURE: 직접 점 찍는 모눈 꺾은선그래프 판
   COLOUR and TYPE: 민트 바탕, 코랄 점·선, 노랑 보상 / Jua + Noto Sans KR
   LAYOUT: 점수바 → 단계 탭 → 큰 작업판 하나 */
:root{color-scheme:light dark;--bg:light-dark(#eaf8f4,#0d1b1a);--card:light-dark(#ffffff,#152b29);--ink:light-dark(#15302c,#e4f4f1);--mute:light-dark(#587470,#9dbdb7);--mint:#17a998;--mintS:light-dark(#c8eee6,#1d4842);--coral:#ff5a4c;--yel:#ffc21f;--yelS:light-dark(#fff1c2,#4a3d12);--line:light-dark(#cbe2dd,#2a4844);--gm:light-dark(#dbe8e5,#233d3a);--gM:light-dark(#7f9a95,#6b8e88);--ok:#13995a;--bad:#e5484d}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;color:var(--ink);font:16px/1.6 'Noto Sans KR',system-ui,sans-serif;overflow-x:clip;background:var(--bg);background-image:linear-gradient(var(--gm) 1px,transparent 1px),linear-gradient(90deg,var(--gm) 1px,transparent 1px);background-size:28px 28px}
h1,h2,h3,.jua{font-family:Jua,'Noto Sans KR',sans-serif;font-weight:400;line-height:1.15;margin:0}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:1180px;margin:0 auto;padding:0 max(3vw,12px) 40px}
.top{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:14px 0}
.logo{font-size:clamp(24px,4vw,34px);color:var(--mint)}
.logo span{color:var(--coral)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{background:var(--card);border:2px solid var(--line);border-radius:999px;padding:6px 14px;font-weight:700;font-size:15px;min-height:44px;display:flex;align-items:center;gap:6px}
button.chip:hover{border-color:var(--mint)}
.steps{display:flex;gap:6px;overflow-x:auto;padding:4px 0 12px}
.steps button{flex:none;border:0;border-radius:12px;padding:8px 14px;min-height:44px;background:var(--card);color:var(--mute);font-family:Jua,sans-serif;font-size:17px;border:2px solid var(--line)}
.steps button.done{color:var(--mint)}
.steps button.on{background:var(--mint);color:#fff;border-color:var(--mint)}
.steps button:disabled{opacity:.45;cursor:default}
.board{background:var(--card);border:3px solid var(--line);border-radius:22px;padding:clamp(16px,3vw,30px);box-shadow:0 6px 0 var(--line)}
.ttl{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.tag{background:var(--mint);color:#fff;font-family:Jua,sans-serif;font-size:20px;padding:4px 18px 4px 14px;border-radius:8px 30px 30px 8px}
.ttl h2{font-size:clamp(22px,3.2vw,30px)}
.sub{color:var(--mute);margin:0 0 16px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,200px),1fr));gap:14px}
.tc{position:relative;text-align:left;border:3px solid var(--line);background:var(--card);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:4px;transition:transform .15s,border-color .15s}
.tc:hover,.tc:focus-visible{transform:translateY(-4px) rotate(-1deg);border-color:var(--coral);outline:none}
.tc .em{font-size:40px;line-height:1}
.tc .cat{font-size:13px;font-weight:700;color:var(--mint)}
.tc b{font-size:17px;line-height:1.3}
.tc small{color:var(--mute)}
.best{position:absolute;top:10px;right:10px;background:var(--yel);color:#3a2c00;font-weight:900;font-size:13px;padding:2px 8px;border-radius:999px}
.big{border:0;border-radius:14px;padding:12px 22px;min-height:48px;font-family:Jua,sans-serif;font-size:20px;background:var(--coral);color:#fff;box-shadow:0 4px 0 #c43d31}
.big:active{transform:translateY(3px);box-shadow:0 1px 0 #c43d31}
.big.m{background:var(--mint);box-shadow:0 4px 0 #0e7a6d}
.big.y{background:var(--yel);color:#3a2c00;box-shadow:0 4px 0 #c29000}
.big:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.bubble{position:relative;display:inline-block;background:var(--card);border:3px solid var(--line);border-radius:20px;padding:12px 20px;font-family:Jua,sans-serif;font-size:21px;margin:0 0 18px 56px}
.bubble::before{content:attr(data-em);position:absolute;left:-58px;top:50%;transform:translateY(-50%);font-size:42px}
.mission{background:var(--yelS);border-radius:14px;padding:12px 16px;font-weight:700;margin-bottom:16px}
.portal{border:2px solid var(--line);border-radius:14px;overflow:hidden}
.pbar{background:var(--mint);color:#fff;padding:8px 14px;font-weight:700;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:15px}
.pbody{padding:16px}
.cond{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;border:1px solid var(--line);padding:14px;border-radius:10px}
.cond label{font-weight:700;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
select,input[type=text]{min-height:44px;font-size:16px;border:2px solid var(--line);border-radius:10px;padding:6px 10px;background:var(--card)}
select:focus,input:focus,button:focus-visible{outline:3px solid var(--yel);outline-offset:2px}
.fb{min-height:28px;margin:12px 0 0;font-weight:700}
.fb.ok{color:var(--ok)}.fb.bad{color:var(--bad)}
table{border-collapse:collapse}
.ptab{width:100%;max-width:560px;margin-top:14px;font-size:16px}
.ptab th,.ptab td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:center}.ptab td{white-space:nowrap}
.ptab th{background:var(--mintS)}
.ptab td.n{text-align:right;font-weight:700;white-space:nowrap}
.src{font-size:13px;color:var(--mute);margin-top:8px}
.scroll{overflow-x:auto}
.htab{margin:8px auto;font-size:18px;border:3px solid #8cc56b;border-radius:14px;border-collapse:separate;border-spacing:0;overflow:hidden}
.htab th,.htab td{border:1px solid #b8dca1;padding:5px;text-align:center;min-width:62px}
.htab th{background:#c4df9b;color:#1f3a12;font-family:Jua,sans-serif;font-weight:400;padding:6px 10px;min-width:0;max-width:7.5em;line-height:1.2}
.htab td{background:var(--card)}
.pool{display:flex;flex-wrap:wrap;gap:8px;padding:10px;border:2px dashed var(--line);border-radius:12px;min-height:64px;align-items:center;margin:10px 0}
.pool.over{border-color:var(--mint);background:var(--mintS)}
.pl{font-weight:900;font-size:14px;color:var(--mute);margin-right:4px;flex:none}
.tile{display:inline-flex;align-items:center;justify-content:center;min-width:50px;min-height:44px;padding:4px 8px;border-radius:10px;font-weight:900;font-size:17px;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;box-shadow:0 3px 0 rgba(0,0,0,.2);white-space:nowrap}
.tile.y{background:#c4df9b;color:#1f3a12}.tile.v{background:var(--yel);color:#3a2c00}
.tile.sel{outline:3px solid var(--coral);outline-offset:2px;transform:translateY(-3px)}
.tile.lift{opacity:.3}
.ghost{position:fixed;z-index:20;pointer-events:none;transform:translate(-50%,-60%) scale(1.12) rotate(-3deg);box-shadow:0 10px 18px rgba(0,0,0,.3)}
.slot{width:100%;min-width:56px;min-height:54px;border:2px dashed var(--gM);border-radius:10px;background:transparent;padding:3px;display:flex;align-items:center;justify-content:center;color:var(--mute);font-weight:900;font-size:20px}
.slot.over{border-color:var(--mint);border-style:solid;background:var(--mintS)}
.slot.ok{border:3px solid var(--ok)}.slot.bad{border:3px solid var(--bad);background:color-mix(in srgb,var(--bad) 14%,transparent)}
.htab input{width:100%;min-width:70px;text-align:center;min-height:44px;font-size:18px;border:2px dashed var(--line);border-radius:8px;background:transparent}
.htab input.ok{border:2px solid var(--ok);background:color-mix(in srgb,var(--ok) 12%,transparent)}
.htab input.bad{border:2px solid var(--bad);background:color-mix(in srgb,var(--bad) 12%,transparent)}
.cap{font-family:Jua,sans-serif;font-size:22px;color:var(--coral);text-align:center;border:3px solid var(--mint);border-radius:12px;padding:4px 18px;display:table;margin:0 auto 6px}
.grid2{display:grid;grid-template-columns:minmax(0,260px) minmax(0,1fr);gap:20px;align-items:start}
@media(max-width:820px){.grid2{grid-template-columns:minmax(0,1fr)}}
.todo{list-style:none;padding:0;margin:0 0 14px;display:grid;gap:6px}
.todo li{padding:8px 12px;border-radius:10px;background:var(--bg);font-weight:700;color:var(--mute)}
.todo li.now{background:var(--yelS);color:var(--ink)}
.todo li.fin{color:var(--ok)}
.todo li.fin::before{content:'✔ '}
.todo.h{display:flex;flex-wrap:wrap;gap:6px}.todo.h li{flex:1 1 150px;text-align:center}
.gpanel{background:var(--yelS);border-radius:14px;padding:14px 16px;margin-bottom:12px}
.gpanel .fb{margin-top:8px;min-height:0}
.fig .ph{display:grid;place-items:center;height:100%;background:var(--card);border-radius:12px;font-family:Jua;font-size:26px;color:var(--mute);text-align:center;padding:20px}
.yl{font-size:17px!important}.xl{font-size:18px!important}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{border:3px solid var(--line);background:var(--card);border-radius:12px;padding:8px 16px;min-height:48px;font-weight:700;font-size:17px}
.opt:hover{border-color:var(--mint)}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 15%,var(--card))}
.opt.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 15%,var(--card))}
.fig{position:relative;width:100%;aspect-ratio:900/600;min-height:240px;background:#c4df9b;border-radius:16px;padding:6px}
.fig svg{width:100%;height:100%;display:block;touch-action:none;user-select:none}
.pa{fill:var(--card)}
.gm{stroke:var(--gm);stroke-width:1}.gM{stroke:var(--gM);stroke-width:1.5}.gv{stroke:var(--gM);stroke-width:1}
.fr{fill:none;stroke:#3d4f4b;stroke-width:2}
.yl{font:700 15px 'Noto Sans KR',sans-serif;fill:#1f3a12;text-anchor:end}
.xl{font:700 16px 'Noto Sans KR',sans-serif;fill:#1f3a12;text-anchor:middle}
.ul{font:700 14px 'Noto Sans KR',sans-serif;fill:#1f3a12}
.gt{font:24px Jua,sans-serif;fill:var(--coral);text-anchor:middle}
.hv{stroke:var(--coral);stroke-dasharray:5 4;stroke-width:1.5}
.ro{font:700 15px 'Noto Sans KR',sans-serif;fill:#fff}
.pt{fill:var(--coral);stroke:#fff;stroke-width:2}
.pt.g{fill:var(--ok)}.pt.b{fill:var(--bad)}
.ln{fill:none;stroke:var(--coral);stroke-width:3.5;stroke-linejoin:round;stroke-dasharray:3000;stroke-dashoffset:3000;animation:draw 1.4s ease-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.qcard{background:var(--bg);border-radius:16px;padding:18px}
.qn{font-family:Jua,sans-serif;color:var(--coral);font-size:18px}
.qt{font-size:20px;font-weight:900;margin:4px 0 14px;line-height:1.4}
.score{font-family:Jua,sans-serif;font-size:clamp(64px,12vw,110px);color:var(--coral);line-height:1;text-align:center}
.bars{display:grid;gap:8px;max-width:520px;margin:16px auto}
.bar{display:grid;grid-template-columns:7em minmax(0,1fr) 4.5em;gap:10px;align-items:center;font-weight:700}
.bar i{display:block;height:16px;border-radius:9px;background:var(--mint)}
.bar .tr{background:var(--bg);border-radius:9px}
.bar b{text-align:right;white-space:nowrap}
.gacha{text-align:center;margin:20px 0}
.cap2{font-size:90px;display:inline-block;line-height:1}
.shake{animation:sh .9s}
@keyframes sh{0%,100%{transform:rotate(0)}20%{transform:rotate(-18deg) scale(1.1)}40%{transform:rotate(16deg)}60%{transform:rotate(-12deg) scale(1.15)}80%{transform:rotate(8deg)}}
.prize{display:inline-flex;flex-direction:column;align-items:center;gap:4px;padding:14px 26px;border-radius:18px;border:4px solid var(--line);background:var(--card);animation:pop .5s}
.prize .e{font-size:72px;line-height:1}
.r0{border-color:#9fb8b3}.r1{border-color:#4f8cff}.r2{border-color:var(--yel);box-shadow:0 0 24px var(--yel)}
.rk{font-size:13px;font-weight:900;padding:2px 10px;border-radius:999px;color:#fff}
.rk.r0{background:#7d9893}.rk.r1{background:#4f8cff}.rk.r2{background:#e0a400}
@keyframes pop{0%{transform:scale(.3)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;padding:16px;z-index:9}
#ov.on{display:flex}
#ov .board{max-width:640px;width:100%;max-height:88vh;overflow:auto}
#ov .ln{animation:none;stroke-dashoffset:0}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;margin-top:12px}
.gcard{position:relative;border:3px solid var(--line);border-radius:16px;overflow:hidden;background:var(--card)}
.gview{display:block;width:100%;border:0;padding:6px;background:#c4df9b;cursor:zoom-in}.gview svg{width:100%;height:auto;display:block}
.gmeta{padding:8px 12px;display:flex;flex-direction:column;gap:2px}.gmeta b{font-size:16px}.gmeta span{font-size:13px;color:var(--mute)}
.gdel{position:absolute;right:8px;bottom:8px;border:0;background:transparent;font-size:18px;min-height:36px;min-width:36px;opacity:.6}.gdel:hover{opacity:1}
.alb{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:10px;margin-top:12px}
.alb div{border:3px solid var(--line);border-radius:14px;text-align:center;padding:8px 4px;font-size:13px;font-weight:700}
.alb div span{display:block;font-size:38px;line-height:1.2}
.alb div.no{opacity:.35}
.cf{position:fixed;top:-20px;width:10px;height:14px;z-index:8;animation:fall linear forwards;pointer-events:none}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.foot{font-size:13px;color:var(--mute);margin-top:18px;text-align:center}
.hint{font-size:14px;color:var(--mute)}
@media(prefers-reduced-motion:reduce){.ln{animation:none;stroke-dashoffset:0}.shake,.prize,.cf{animation:none}.tc{transition:none}}
@media(max-width:600px){.htab{font-size:15px}.htab th,.htab td{min-width:64px}.bubble{font-size:18px}}
</style></head><body>
<div class="wrap">
  <header class="top">
    <h1 class="logo">꺾은선그래프 <span>탐정단</span></h1>

  <p class="foot">자료는 공개된 통계·공식 기록을 바탕으로 했어요. 단위를 맞추려고 일부 값은 어림했어요. (연습용 포털 화면이에요)</p>
</div>

function makeQuiz(d){
  const v=d.v,n=v.length,L=d.label,u=d.unit,Y=i=>yl(d,i),all=[...Array(n).keys()];
  const mk=(t,right,pool,e)=>{const o=shuf([right,...shuf([...new Set(pool)].filter(p=>p!==right)).slice(0,3)]);return{t,o,a:o.indexOf(right),e}};
  const c=[],mx=Math.max(...v),mn=Math.min(...v),j=josa(L,'이','가'),jn=josa(L,'은','는');
  if(v.filter(a=>a===mx).length===1){const i=v.indexOf(mx);c.push(mk(`${L}${j} 가장 많은 때는 언제인가요?`,Y(i),all.map(Y),`점이 가장 높은 곳이 ${Y(i)}이에요. (${vu(d,mx)})`))}
  if(v.filter(a=>a===mn).length===1){const i=v.indexOf(mn);c.push(mk(`${L}${j} 가장 적은 때는 언제인가요?`,Y(i),all.map(Y),`점이 가장 낮은 곳이 ${Y(i)}이에요. (${vu(d,mn)})`))}
  const dd=v.slice(1).map((a,i)=>a-v[i]),I=i=>`${Y(i)} → ${Y(i+1)}`,iv=dd.map((_,i)=>I(i));
  const up=Math.max(...dd),dn=Math.min(...dd);
  if(up>0&&dd.filter(a=>a===up).length===1){const i=dd.indexOf(up);c.push(mk('바로 앞보다 가장 많이 늘어난 때는 언제인가요?',I(i),iv,`선이 가장 가파르게 올라간 곳이에요. ${vu(d,v[i])} → ${vu(d,v[i+1])} (${fmt(up)}${u} 늘었어요)`))}
  if(dn<0&&dd.filter(a=>a===dn).length===1){const i=dd.indexOf(dn);c.push(mk('바로 앞보다 가장 많이 줄어든 때는 언제인가요?',I(i),iv,`선이 가장 가파르게 내려간 곳이에요. ${vu(d,v[i])} → ${vu(d,v[i+1])} (${fmt(-dn)}${u} 줄었어요)`))}
  const uniq=shuf(all.filter(i=>v.filter(a=>a===v[i]).length===1));
  let k=0;
  while(c.length<4&&k<uniq.length){const i=uniq[k++];let pool=[...new Set(v)].filter(a=>a!==v[i]);const s=Math.max(d.step,Math.round(mx/20));while(pool.length<3)pool.push(v[i]+s*(pool.length+1));c.push(mk(`${Y(i)}의 ${L}${jn} 얼마인가요?`,vu(d,v[i]),pool.map(a=>vu(d,a)),`그래프에서 ${Y(i)} 위의 점을 세로 눈금에 맞춰 읽으면 ${vu(d,v[i])}예요.`))}
  const list=shuf(c).slice(0,4);
  const q=d.q===WAVE?{t:'이 그래프에 물결선(≈)을 넣은 까닭은?',o:['그래프를 예쁘게 꾸미려고','필요 없는 부분을 줄여서 변화가 잘 보이게 하려고','값이 0이라서','틀린 부분을 지우려고'],a:1,e:`0부터 ${fmt(d.base)}${u}까지는 점이 하나도 없어요. 물결선으로 줄이면 눈금을 촘촘하게 써서 변화가 크게 보여요.`}:d.q;
  list.push(q);return list;
}

function bindSvg(svg){
  const d=S.d,g=S.gr,n=d.v.length,W=GW,H=GH,L=GL,R=GR,B=GB,wav=d.base>0;
  const geo=()=>{const T=g.title?60:38,pb=H-B-(wav?32:0);return{T,pb,ph:pb-T,cw:(W-L-R)/n}};
  const at=e=>{const pt=svg.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;const p=pt.matrixTransform(svg.getScreenCTM().inverse()),G=geo();
    if(p.x<L||p.x>W-R||p.y<G.T-12||p.y>G.pb+12)return null;
    const i=Math.min(n-1,Math.max(0,Math.floor((p.x-L)/G.cw))),sn=snapOf(d,g.s),top=g.rows*g.s;
    let raw=(G.pb-p.y)/G.ph*top;raw=Math.max(0,Math.min(top,raw));return{i,v:d.base+Math.round(raw/sn)*sn}};
  const redraw=()=>{svg.innerHTML=svgInner(true)};
  svg.addEventListener('pointermove',e=>{if(phase()!=='pts'){if(g.hover){g.hover=null;redraw()}return}g.hover=at(e);redraw()});
  svg.addEventListener('pointerleave',()=>{g.hover=null;redraw()});
  svg.addEventListener('pointerdown',e=>{if(phase()!=='pts')return;const h=at(e);if(!h||g.ok[h.i])return;g.pts[h.i]=h.v;(g.hist=g.hist||[]).push(h.i);g.chk=false;g.hover=h;beep(true);redraw();

}

  ov.innerHTML=`<div class="row" style="justify-content:space-between"><h2>🖼️ 내 그래프 모음 (${G.length})</h2><button class="chip" data-act="closeOv">닫기 ✕</button></div>
  <p class="hint">완성한 꺾은선그래프가 여기에 모여요. 누르면 크게 볼 수 있어요. (이 기기에만 저장돼요)</p>
  ${G.length?`<div class="gal">${G.map((e,i)=>{const q=gs(e);if(!q)return'';return `<div class="gcard"><button class="gview" data-act="viewG" data-i="${i}"><svg viewBox="0 0 ${GW} ${GH}">${svgInner(false,q.d,q.g)}</svg></button><div class="gmeta"><b>${esc(e.title)}</b><span>${q.d.em} ${e.score}점 · ${dt(e.at)}</span></div><button class="gdel" data-act="delG" data-i="${i}" aria-label="지우기">🗑️</button></div>`}).join('')}</div>`:'<p style="text-align:center;font-size:20px;padding:30px 0">아직 완성한 그래프가 없어요. 미션을 끝내면 여기에 모여요! 📈</p>'}`;
  $('#ov').classList.add('on');
}
function album(){
  $('#ovb').style.maxWidth='';
  const own=ST.filter(s=>save.st[s[0]]).length;
  $('#ovb').innerHTML=`<div class="row" style="justify-content:space-between"><h2>📒 스티커 앨범 ${own}/${ST.length}</h2><button class="chip" data-act="closeOv">닫기 ✕</button></div>
  <p class="hint">일반 · <span style="color:#4f8cff;font-weight:700">희귀</span> · <span style="color:#e0a400;font-weight:700">전설</span> 스티커를 모아 봐요!</p>
  <div class="alb">${ST.map(s=>save.st[s[0]]?`<div class="r${s[2]}"><span>${s[0]}</span>${s[1]}${save.st[s[0]]>1?' ×'+save.st[s[0]]:''}</div>`:`<div class="no r${s[2]}"><span>❔</span>${RN[s[2]]}</div>`).join('')}</div>`;
  $('#ov').classList.add('on');
}

render();
}
</script>
</body></html>
